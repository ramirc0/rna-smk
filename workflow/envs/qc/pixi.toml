# QC rules. Kept apart from ../pixi.toml so a change here never reruns the
# production rules.
[workspace]
name = "rna-smk-qc"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
exclude-newer = "7d"

[dependencies]
python = "3.13.*"
rseqc = "==5.0.5"
samtools = "==1.24"
scipy = "*"
ucsc-genepredtobed = "*"
ucsc-gtftogenepred = "*"

[exclude-newer]
ca-certificates = "0d"
certifi = "0d"
pip = "0d"

[pypi-exclude-newer]
certifi = "0d"
pip = "0d"
