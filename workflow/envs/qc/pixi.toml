# QC rules. Kept apart from ../pixi.toml so a change here never reruns the
# production rules.
[workspace]
name = "rna-smk-qc"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
rseqc = "==5.0.5"
samtools = "==1.24"
scipy = "*"
ucsc-genepredtobed = "*"
ucsc-gtftogenepred = "*"
