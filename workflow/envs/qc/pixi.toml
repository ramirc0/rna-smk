# QC rules. Kept apart from ../pixi.toml so a change here never reruns the
# production rules.
[workspace]
name = "rna-smk-qc"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
matplotlib = "*"
numpy = "*"
polars = "*"
rseqc = "==5.0.5"
samtools = "==1.22"
scipy = "*"
ucsc-genepredtobed = "*"
ucsc-gtftogenepred = "*"

[pypi-dependencies]
poikilos = { git = "https://github.com/ramirc0/poikilos" }

# Rule jobs only save figures. Without this, a job that inherits DISPLAY picks a GUI backend.
[activation.env]
MPLBACKEND = "Agg"
