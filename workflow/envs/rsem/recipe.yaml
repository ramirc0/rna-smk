package:
  name: rsem
  version: 1.3.3

# The commit in clarity001/rna-smk:latest: v1.3.3 plus two README commits.
source:
  git: https://github.com/deweylab/RSEM.git
  rev: 8bc1e2115493c0cdf3c6bee80ef7a21a91b2acce

build:
  number: 0
  # RSEM's Makefile empties CPPFLAGS, which keeps conda's -DNDEBUG out, and
  # passes that to bundled samtools' configure. The image built with
  # CFLAGS=-O3. The include and link paths ride along in CC and CXX.
  script:
    - export CFLAGS="-O3"
    - paths="-isystem $PREFIX/include -L$PREFIX/lib -Wl,-rpath,$PREFIX/lib"
    - make CC="$CC $paths" CXX="$CXX $paths" -j"$CPU_COUNT"
    - make install prefix="$PREFIX"

requirements:
  build:
    - gcc_linux-64 13.*
    - gxx_linux-64 13.*
    - make
  host:
    - zlib
  run:
    - perl

tests:
  - script:
      - rsem-calculate-expression --version
