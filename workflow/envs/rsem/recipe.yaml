package:
  name: rsem
  version: 1.3.3

# RSEM master past v1.3.3: C++17, with Boost-compatible RNG distributions in
# place of Boost.
source:
  git: https://github.com/deweylab/RSEM.git
  rev: 800234e0d25d16bf7042804604c4371f12b96d9e

build:
  number: 0
  # RSEM's Makefile empties CPPFLAGS, which keeps conda's -DNDEBUG out, and
  # passes that to bundled samtools' configure. The include and link paths
  # ride along in CC and CXX.
  script:
    - export CFLAGS="-O3"
    - paths="-isystem $PREFIX/include -L$PREFIX/lib -Wl,-rpath,$PREFIX/lib"
    - make CC="$CC $paths" CXX="$CXX $paths" -j"$CPU_COUNT"
    - make install prefix="$PREFIX"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - make
  host:
    - zlib
  run:
    - perl

tests:
  - script:
      - rsem-calculate-expression --version
