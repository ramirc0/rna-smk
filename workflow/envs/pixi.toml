[workspace]
name = "rna-smk-envs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
exclude-newer = "7d"
preview = ["pixi-build"]

# RSEM builds from source in rsem/.
[dependencies]
python = "3.14.*"
bigtools = "==0.5.8"
fastp = "==1.4.0"
htslib = "==1.24"
rsem = { path = "rsem" }
samtools = "==1.24"
star = "==2.7.11b"
numpy = "==2.5.4"
pandas = "==3.1.1"

[exclude-newer]
ca-certificates = "0d"
certifi = "0d"
pip = "0d"

[pypi-exclude-newer]
certifi = "0d"
pip = "0d"
